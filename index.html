<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title></title>
  <style>
      body {
        background-color: black;
        text-align: center;
      }

      .lds-ring {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
        margin-top: 40vh;
      }
      .lds-ring div {
        box-sizing: border-box;
        display: block;
        position: absolute;
        width: 64px;
        height: 64px;
        margin: 8px;
        border: 8px solid #fff;
        border-radius: 50%;
        animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        border-color: #fff transparent transparent transparent;
      }
      .lds-ring div:nth-child(1) { animation-delay: -0.45s; }
      .lds-ring div:nth-child(2) { animation-delay: -0.3s; }
      .lds-ring div:nth-child(3) { animation-delay: -0.15s; }
      @keyframes lds-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="lds-ring"><div></div><div></div><div></div><div></div></div>

  <script>
    const AS_URL_BASE = "https://script.google.com/macros/s/AKfycbzUHHa12oD5goM2HiUDdfv8MhVLalRAugLmgVMbSdCYNGIYrwXqjPcei6ZexUslXBr4lw/exec";

    const params = new URLSearchParams(window.location.search);
    const k = params.get('k');

    if (k) {
      // Navegación directa, SIN fetch. script.google.com bloquea fetch()
      // cross-origin (CORS), pero una navegación normal de página sí funciona,
      // porque el Apps Script hace su propio redirect vía meta-refresh.
      document.location.replace(AS_URL_BASE + '?k=' + encodeURIComponent(k));
    } else {
      document.body.innerHTML = '<p style="color:white">Código no válido.</p>';
    }
  </script>
</body>
</html>
